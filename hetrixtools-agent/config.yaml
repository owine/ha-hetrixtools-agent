---
name: "HetrixTools Agent"
description: "Runs the HetrixTools server monitoring agent to report this Home Assistant host to HetrixTools"
# Bumped by the Build workflow's promote job once the release image is
# published, so the store never offers an unpullable version.
version: "0.2.3"
slug: "hetrixtools_agent"
init: false
image: "ghcr.io/owine/hetrixtools-agent"

arch:
  - aarch64
  - amd64

url: "https://github.com/owine/ha-hetrixtools-agent"

startup: services
boot: auto

# Host visibility: report the real HA OS host, not the container.
# full_access is only granted with protection mode off (see DOCS.md), and only
# opens every device (cgroup rule "a *:* rwm"); it adds no capabilities.
# host_pid must stay off: s6-overlay refuses to start unless it is PID 1, and
# the Supervisor grants host_pid exactly when protection mode is off, so the
# app would fail to boot for the users who need full_access. /proc/stat,
# /proc/meminfo and /proc/uptime are host-wide without it anyway.
full_access: true
host_network: true
udev: true
# Capabilities are granted whatever the protection mode.
# - NET_RAW: ICMP outgoing_pings open raw sockets. Docker grants it by default
#   today, but the Supervisor is moving to drop it unless requested here.
# - SYS_RAWIO: SMART on SATA disks (ATA pass-through over SG_IO).
# - SYS_ADMIN: SMART on NVMe drives (admin Get Log Page).
# The two SMART ones only matter with protection mode off, when full_access
# lets the app open the disks.
privileged:
  - NET_RAW
  - SYS_RAWIO
  - SYS_ADMIN

options:
  sid: ""
  collect_every_seconds: 3
  check_drive_health: false
  check_soft_raid: false
  check_reboot: false
  running_processes: false
  connection_ports: []
  check_services: []
  ignored_disks: ""
  outgoing_pings: []
  outgoing_pings_count: 20
  dry_run: false
  debug: false

schema:
  sid: "match(^[A-Za-z0-9]{32}$)"
  collect_every_seconds: "int(1,60)"
  check_drive_health: "bool"
  check_soft_raid: "bool"
  check_reboot: "bool"
  running_processes: "bool"
  connection_ports:
    - "str"
  check_services:
    - "str"
  ignored_disks: "str?"
  outgoing_pings:
    - "str"
  outgoing_pings_count: "int(10,40)"
  dry_run: "bool"
  debug: "bool"
