---
name: Build
"on":
  push:
    branches: [main]
    paths: ["hetrixtools-agent/**"]
  release:
    types: [published]
permissions:
  contents: read
env:
  # Single source of truth for the build matrix + image name (kept in sync
  # across the matrix and the manifest job).
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hetrixtools-agent
jobs:
  init:
    # The promote job's own config.yaml + CHANGELOG.md commit lands under
    # hetrixtools-agent/**; it changes nothing in the image, so skip the
    # redundant no-push build. The message prefix must match the headline
    # promote commits with. The
    # actor check keeps a human commit with the same prefix from being skipped.
    if: >-
      github.event_name != 'push' ||
      !(startsWith(github.event.head_commit.message, 'chore(release): publish ') &&
        github.actor == 'ha-hetrixtools-agent-release-bot[bot]')
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On a release the version comes from the tag (hetrixtools-agent-vX.Y.Z):
      # the tagged config.yaml still holds the previous version, because the
      # promote job below only bumps it after the image is published. The
      # builder action stamps it into the image's io.hass.version label.
      # Validated here, before anything is pushed, so a hand-made or prerelease
      # tag cannot publish an odd image tag or move `latest`.
      - name: Read app version
        id: meta
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            [[ "${TAG_NAME}" == hetrixtools-agent-v* ]] || {
              echo "::error::tag ${TAG_NAME} is not a release tag (hetrixtools-agent-vX.Y.Z)"
              exit 1; }
            version="${TAG_NAME#hetrixtools-agent-v}"
          else
            version="$(grep -E '^version:' hetrixtools-agent/config.yaml \
              | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::unexpected version '${version}'"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # This step owns the runner label for the `build` job below. The action
      # maps each architecture to a runner OS internally, so there is no
      # `runs-on:` literal in this repo to bump and Renovate's github-runners
      # manager has nothing to match on. The labels move only when this
      # action's pinned digest moves — an ordinary digest bump can change the
      # build runner OS without mentioning Ubuntu anywhere in the diff, so read
      # the action source when reviewing those bumps.
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ghcr.io/owine
  build:
    name: Build ${{ matrix.arch }}
    needs: init
    # The runner label comes from the init matrix, not from this file — see the
    # note on the "Build matrix" step above. build-image has no QEMU/platforms,
    # so each arch builds natively on its own runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signing
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build & push ${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          context: hetrixtools-agent
          # Base image is pinned (tag + digest) as the Dockerfile BUILD_FROM
          # default; buildx selects the arch from the multi-arch manifest.
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          # Push/sign only on a published release; branch pushes just build.
          push: ${{ github.event_name == 'release' }}
          cosign: ${{ github.event_name == 'release' }}
  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    # Only on a release: combine the per-arch images pushed above into the single
    # multi-arch manifest that config.yaml's `image:` points at (no {arch}).
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      id-token: write  # keyless cosign signing of the manifest
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
  promote:
    name: Publish version to add-on store
    needs: [init, manifest]
    # Supervisor reads config.yaml from main, so bumping its version is what
    # offers the update to HA instances. Doing it here, gated on the manifest
    # job, means the store never advertises a version that cannot be pulled; a
    # failed build leaves the previous, working version in place.
    #
    # Supervisor also shows CHANGELOG.md to users, so the release notes (the
    # published release's body, drafted by release-drafter) are prepended to it
    # in the same commit: HA never sees a version without its changelog.
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    # The App secrets live in the `release` environment, which only main and
    # hetrixtools-agent-v* tags can deploy to (a release: published run is on
    # its tag, so it qualifies). The App can bypass the main ruleset, so its key
    # must not be readable from a workflow on another branch.
    environment: release
    # Writes go through the App token below; the GITHUB_TOKEN is not used.
    permissions: {}
    defaults:
      run:
        shell: bash  # adds pipefail, so a failed inspect/gh call surfaces as itself
    steps:
      - name: Verify the published manifest covers every arch
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          platforms="$(docker buildx imagetools inspect --raw \
            "ghcr.io/owine/${IMAGE_NAME}:${VERSION}" \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')"
          for arch in $(jq -r '.[]' <<<"${ARCHITECTURES}"); do
            [ "${arch}" = aarch64 ] && arch=arm64
            grep -qx "linux/${arch}" <<<"${platforms}" || {
              echo "::error::${VERSION} manifest is missing linux/${arch}"; exit 1; }
          done
      # The release App is a bypass actor on the main ruleset, so it can commit
      # directly; the default GITHUB_TOKEN cannot.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Committed through GraphQL createCommitOnBranch rather than git push so
      # GitHub signs the commit, and both files land in one commit.
      # expectedHeadOid makes a concurrent push to main fail the commit instead
      # of being overwritten. The commit's chore type is pre-excluded from
      # release-drafter's notes, and its headline must keep the prefix init's
      # skip condition matches. Re-running an older release's job (or a slow
      # run finishing after a newer one) must not move the store backwards, so
      # never downgrade.
      - name: Bump config.yaml and CHANGELOG.md on main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.init.outputs.version }}
          TAG_SHA: ${{ github.sha }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          CONFIG: hetrixtools-agent/config.yaml
          CHANGELOG: hetrixtools-agent/CHANGELOG.md
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "${VERSION}" =~ ${semver} ]]; then
            echo "::error::release tag gives version '${VERSION}', expected X.Y.Z"
            exit 1
          fi
          # Read everything at one main commit; the commit below is made
          # against that same commit or not at all.
          head="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          # A release can be cut by hand on any commit, but only reviewed code
          # may reach HA: the tagged commit must already be on main.
          status="$(gh api "repos/${REPO}/compare/${TAG_SHA}...${head}" --jq .status)"
          if [ "${status}" != identical ] && [ "${status}" != ahead ]; then
            echo "::error::release commit ${TAG_SHA} is not on main (${status}); not promoting"
            exit 1
          fi
          cd "${RUNNER_TEMP}" || exit 1
          raw=(-H "Accept: application/vnd.github.raw")
          gh api "${raw[@]}" "repos/${REPO}/contents/${CONFIG}?ref=${head}" > config.yaml
          current="$(sed -nE 's/^version: "([^"]+)".*/\1/p' config.yaml)"
          if ! [[ "${current}" =~ ${semver} ]]; then
            echo "::error::no 'version: \"X.Y.Z\"' line in ${CONFIG} (got '${current}')"
            exit 1
          fi
          # Only ever move forward: re-running an older release's promote must
          # not roll HA users back to it, nor add its notes to the changelog
          # a second time.
          newest="$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -n1)"
          if [ "${current}" = "${VERSION}" ] || [ "${newest}" != "${VERSION}" ]; then
            echo "::notice::config.yaml is at ${current}; leaving it and ${CHANGELOG} (release ${VERSION})"
            exit 0
          fi
          sed -i -E "s/^version: \"[^\"]+\"/version: \"${VERSION}\"/" config.yaml

          gh api "${raw[@]}" "repos/${REPO}/contents/${CHANGELOG}?ref=${head}" > CHANGELOG.md
          if [ "$(head -n1 CHANGELOG.md)" != "# Changelog" ]; then
            echo "::error::${CHANGELOG} does not start with '# Changelog'"
            exit 1
          fi
          # The notes cover the range since the previous published release,
          # which is what release-drafter drafted them against.
          prev="$(gh api --paginate "repos/${REPO}/releases" \
              --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' |
            sed -nE 's/^hetrixtools-agent-v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -uV |
            awk -v v="${VERSION}" '$0 == v { prev = p } { p = $0 } END { print prev }')"
          if [ -z "${prev}" ]; then
            echo "::error::no published release before ${VERSION} to compare against"
            exit 1
          fi
          if [ "${prev}" != "${current}" ]; then
            echo "::warning::HA is moving from ${current}, but these notes only cover ${prev}...${VERSION}"
          fi
          # $(...) drops the body's trailing blank lines, so one blank line
          # separates it from the previous entry.
          body="$(printf '%s' "${RELEASE_BODY}" | tr -d '\r')"
          # Match the existing (release-please era) entries: categories one
          # level below the version heading, and PR numbers as links, since
          # neither HA nor GitHub's file view autolinks #123.
          compare="https://github.com/${REPO}/compare/hetrixtools-agent-v${prev}...hetrixtools-agent-v${VERSION}"
          {
            echo "# Changelog"
            echo
            echo "## [${VERSION}](${compare}) (${PUBLISHED_AT%%T*})"
            echo
            printf '%s\n' "${body}" |
              sed -E -e 's/^(#+ )/#\1/' \
                -e "s|\(#([0-9]+)\)|([#\1](https://github.com/${REPO}/issues/\1))|g"
            echo
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          jq -n \
            --arg repo "${REPO}" \
            --arg head "${head}" \
            --arg headline "chore(release): publish ${VERSION} to add-on store" \
            --arg config_path "${CONFIG}" \
            --rawfile config <(base64 -w0 config.yaml) \
            --arg changelog_path "${CHANGELOG}" \
            --rawfile changelog <(base64 -w0 CHANGELOG.md) \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid } } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                expectedHeadOid: $head,
                message: { headline: $headline },
                fileChanges: { additions: [
                  { path: $config_path, contents: $config },
                  { path: $changelog_path, contents: $changelog }
                ] }
              } }
            }' > commit.json
          gh api graphql --input commit.json \
            --jq '.data.createCommitOnBranch.commit | "Committed " + .oid + " (verified: " + (.signature.isValid | tostring) + ")"'
  notify-failure:
    name: Report a release that did not reach the store
    needs: [init, build, manifest, promote]
    # Open an issue rather than rely on GitHub's failure email to whoever
    # published the release, since a failure here means the release silently
    # never ships (the store keeps the previous version).
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Release ${TAG_NAME} did not reach the add-on store"
          # One issue per release: a failed re-run comments on it instead.
          existing="$(gh issue list --state open --search "in:title \"${title}\"" \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F'\t' -v t="${title}" '$2 == t { print $1; exit }')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "Failed again: ${RUN_URL}"
            exit 0
          fi
          gh issue create --label bug --title "${title}" --body "$(cat <<BODY
          The Build run for \`${TAG_NAME}\` failed, so \`config.yaml\` on main was not
          bumped and HA instances are still offered the previous version.

          Run: ${RUN_URL}

          Fix the cause, then re-run the failed jobs. \`promote\` is idempotent and
          will not downgrade the store if a newer release has shipped since.
          BODY
          )"
