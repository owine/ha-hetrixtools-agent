---
name: Lint
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual re-run lever if GitHub drops a pull_request event
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Runs PR code (bats tests, shell scripts), so the token only gets to read.
permissions:
  contents: read
jobs:
  lint:
    name: Lint all
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck and yamllint are pre-installed on the ubuntu-26.04 runner image,
      # so they are invoked directly rather than reinstalled.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x hetrixtools-agent/rootfs/usr/lib/hetrixtools/render-config.sh
          shellcheck -x hetrixtools-agent/rootfs/usr/lib/hetrixtools/detect-interfaces.sh
          shellcheck -x hetrixtools-agent/rootfs/usr/lib/hetrixtools/debug-log-filter.sh
          shellcheck -s bash hetrixtools-agent/rootfs/etc/s6-overlay/s6-rc.d/hetrixtools/run
          shellcheck tests/smoke.sh
          shellcheck tests/boot.sh
          shellcheck .github/scripts/release-gate.sh
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: hetrixtools-agent/Dockerfile
          config: .hadolint.yaml
          failure-threshold: error
      - name: yamllint
        run: |
          yamllint --version
          yamllint hetrixtools-agent/config.yaml hetrixtools-agent/translations repository.yaml .github
      # The bats install below hits the runner's apt mirror on every run. On
      # 2026-11-11 the runners could not resolve azure.archive.ubuntu.com for
      # hours, so `apt-get update` failed. This speed-tests the current mirror
      # against random ones from mirrors.ubuntu.com and switches only if another
      # one wins (on a healthy day nothing changes); it also sets
      # APT::Acquire::Retries "3". apt still verifies every InRelease, so a
      # third-party mirror cannot alter packages. continue-on-error is
      # load-bearing: the action's own `sudo apt-get update` (run when the lists
      # are over 60 min old, always true on a fresh runner) sits outside its
      # `|| exit 0` guard, so with no reachable mirror that call fails the step.
      # Same SHA as claude-terminal-home-assistant so Renovate bumps both.
      - name: Pick a reachable apt mirror
        timeout-minutes: 3
        continue-on-error: true
        uses: vegardit/fast-apt-mirror.sh@806c59276adfff2df420124ad5e4587f018c358a # 1.4.5
      # bats is not part of the runner image; install only if it is missing.
      - name: bats
        run: |
          command -v bats >/dev/null || {
            sudo apt-get update && sudo apt-get install -y bats
          }
          bats tests/render-config.bats tests/detect-interfaces.bats tests/debug-log-filter.bats \
            tests/ping-rtt.bats tests/probe-debug-log.bats tests/tcp-probe.bats \
            tests/release-gate.bats tests/upstream-delta.bats tests/renovate-config.bats \
            tests/dry-run.bats tests/docs-agent-version.bats
      # The vendored agent must be the upstream release named in
      # upstream-agent.version (checked by hash) plus only the patch blocks
      # declared in upstream-agent.patches. A Renovate bump of the version
      # marker alone fails here until the agent is re-vendored and both files
      # updated. The download is only hashed and read as text, never run.
      - name: vendored agent vs upstream
        run: |
          version="$(cat hetrixtools-agent/upstream-agent.version)"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]] || {
            echo "::error::upstream-agent.version is not a release number: '${version}'"; exit 1; }
          upstream="${RUNNER_TEMP}/upstream-hetrixtools_agent.sh"
          curl -fsSL --retry 3 -o "${upstream}" \
            "https://raw.githubusercontent.com/hetrixtools/agent/refs/tags/${version}/hetrixtools_agent.sh"
          echo "$(cat hetrixtools-agent/upstream-agent.sha256)  ${upstream}" | sha256sum --strict -c -
          python3 -I tests/upstream-delta.py "${upstream}" \
            hetrixtools-agent/rootfs/usr/lib/hetrixtools/hetrixtools_agent.sh \
            hetrixtools-agent/upstream-agent.patches
