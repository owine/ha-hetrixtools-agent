---
name: release-please
"on":
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # An App token (not the default GITHUB_TOKEN) so the release PR and the
      # published release trigger downstream workflows (Lint on the PR, the
      # publish build on release). GITHUB_TOKEN-created events do not.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # NOTE: release-please-config.json sets changelog-sections at the top
          # level so every package inherits it. That option REPLACES the default
          # conventional-commits type map rather than merging into it, and any
          # type absent from the map is discarded outright (not just hidden) --
          # which is why Renovate's `deps:` commits rendered an empty changelog
          # and were skipped as "no user facing commits". Add new commit types
          # to that list or they will silently stop triggering releases.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
